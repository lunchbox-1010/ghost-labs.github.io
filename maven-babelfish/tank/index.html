  *{ box-sizing:border-box }
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; background:var(--ground) }
  body{ color:var(--ink); font-family:var(--display); cursor:default }
  body.resting{ cursor:none }

  /* ---------- the tank ---------- */
  .tank{ position:fixed; inset:0; overflow:hidden;
         background:var(--ground);
         background-image:radial-gradient(105% 62% at 50% 40%, #15283a 0%, rgba(7,13,20,0) 70%) }

  /* the two pieces of the original mark, still in their corners, still the backdrop */
  .corner{ position:absolute; background-repeat:no-repeat; background-size:contain;
           pointer-events:none; z-index:1 }
  .corner.sources{ background-image:var(--img-sources); background-position:left top;
                   top:-3%; left:-7%; width:clamp(150px, 26vw, 420px); aspect-ratio:177/318; opacity:.11 }
  .corner.network{ background-image:var(--img-network); background-position:right bottom;
                   bottom:28%; right:-5%; width:clamp(210px, 34vw, 560px); aspect-ratio:176/212; opacity:.11 }

  /* ---------- reefs: the mark's own plumbing, fossilised into the rock ----------
     Same silhouette drives the stone and the mask over the artwork, so the data lines
     read as mineral veins running through the outcrop rather than a logo pasted on. */
  .reef{ position:absolute; bottom:0; pointer-events:none; z-index:5 }
  .reef svg{ position:absolute; inset:0; width:100%; height:100%; display:block }
  .reef .veins{ position:absolute; inset:0; background-repeat:no-repeat; background-size:cover;
                mix-blend-mode:screen; opacity:.26; filter:saturate(.4) brightness(1.15);
                -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
                -webkit-mask-size:100% 100%; mask-size:100% 100% }
  .reef-l{ left:-1%;  width:clamp(190px, 26vw, 440px); height:clamp(150px, 30vh, 350px) }
  .reef-r{ right:-1%; width:clamp(240px, 36vw, 620px); height:clamp(180px, 36vh, 440px) }
  .reef-m{ left:39%;  width:clamp(120px, 17vw, 290px); height:clamp(80px, 15vh, 175px); z-index:4; opacity:.7 }
  .reef-l .veins{ background-position:left bottom; background-image:var(--img-sources); opacity:.34;
                  -webkit-mask-image:var(--mask-l); mask-image:var(--mask-l) }
  .reef-r .veins{ background-position:right bottom; background-image:var(--img-network);
                  -webkit-mask-image:var(--mask-r); mask-image:var(--mask-r) }
  .reef-m .veins{ background-position:center bottom; background-image:var(--img-network); opacity:.15;
                  -webkit-mask-image:var(--mask-m); mask-image:var(--mask-m) }
  /* the house mark, cut into the rock face like a relief someone carved and the water wore down.
     The clip layer carries the outcrop's own silhouette, so the carving can never stray off the
     stone and hang in open water no matter how the tank is sized. */
  .mark-clip{ position:absolute; inset:0; pointer-events:none;
              -webkit-mask-image:var(--mask-r); mask-image:var(--mask-r);
              -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
              -webkit-mask-size:100% 100%; mask-size:100% 100% }
  /* Engraved, not printed: the black-and-white mark is used only as a stencil. A dark copy
     shifted up-left is the shadowed lip of the cut, a pale copy shifted down-right is the
     light catching its lower edge, and the face between them takes the rock's own colour. */
  .mark{ position:absolute; left:35%; top:26%; width:clamp(52px, 6vw, 104px); aspect-ratio:340/342;
         transform:rotate(-6deg); opacity:.62 }
  .mark i{ position:absolute; inset:0; display:block;
           -webkit-mask-image:var(--gl-mark); mask-image:var(--gl-mark);
           -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
           -webkit-mask-size:contain; mask-size:contain;
           -webkit-mask-position:center; mask-position:center }
  .mark .sh{ background:#03080d; opacity:.62; transform:translate(-1.5px,-1.5px) }
  .mark .hl{ background:#cfe2f0; opacity:.20; transform:translate(1.5px,1.5px) }
  .mark .fc{ background:#16303f; opacity:.42 }

  /* water surface, light shafts, caustics — all slow, all ambient */
  .surface{ position:absolute; left:0; right:0; top:0; height:9vh; z-index:2; pointer-events:none;
            background:linear-gradient(180deg, rgba(140,205,255,.20), rgba(140,205,255,0) 85%);
            animation:tide 11s ease-in-out infinite }
  .shafts{ position:absolute; inset:-10% -20% 0 -20%; z-index:2; pointer-events:none; opacity:.5 }
  /* no blur filters here: a blurred, animated, full-height layer re-rasterizes every
     frame and that is what makes the fish stutter. Soft gradients do the same job free. */
  .shaft{ position:absolute; top:-8%; height:118%; width:14vw; transform-origin:top center;
          will-change:transform;
          background:linear-gradient(90deg, rgba(150,212,255,0), rgba(150,212,255,.16) 45%, rgba(150,212,255,0)),
                     linear-gradient(180deg, rgba(150,212,255,.10), rgba(150,212,255,0) 72%) }
  .shaft.a{ left:8%;  animation:sway 17s ease-in-out infinite }
  .shaft.b{ left:34%; width:9vw;  animation:sway 23s ease-in-out infinite -6s }
  .shaft.c{ left:61%; width:17vw; animation:sway 19s ease-in-out infinite -11s }
  .shaft.d{ left:84%; width:8vw;  animation:sway 27s ease-in-out infinite -3s }
  .caustics{ position:absolute; inset:0; z-index:3; pointer-events:none; opacity:.13;
             will-change:transform;
             background:
               radial-gradient(38% 16% at 22% 78%, rgba(150,212,255,.9), transparent 70%),
               radial-gradient(30% 13% at 62% 86%, rgba(150,212,255,.8), transparent 70%),
               radial-gradient(26% 11% at 84% 74%, rgba(150,212,255,.7), transparent 70%);
             animation:ripple 14s ease-in-out infinite }
  @keyframes tide{ 0%,100%{ opacity:.85; transform:translateY(0) } 50%{ opacity:1; transform:translateY(6px) } }
  @keyframes sway{ 0%,100%{ transform:skewX(-6deg) translateX(0) } 50%{ transform:skewX(3deg) translateX(3vw) } }
  @keyframes ripple{ 0%,100%{ transform:translate(0,0) scale(1) } 50%{ transform:translate(2%,-1%) scale(1.06) } }

  /* ---------- seabed and its residents ---------- */
  .bed{ position:absolute; left:0; right:0; bottom:0; height:32vh; z-index:4; pointer-events:none;
        background:linear-gradient(180deg, rgba(107,86,54,0) 0%, rgba(107,86,54,.45) 34%, #4a3b26 100%) }
  .bed svg{ position:absolute; left:0; bottom:0; width:100%; height:100% }

  .prop{ position:absolute; bottom:0; pointer-events:none }
  .prop svg{ width:100%; height:auto; display:block; overflow:visible }
  .p-ship   { left:2%;   width:clamp(320px, 46vw, 760px); z-index:6 }
  /* the chest is far off across the sand now — small, dimmer, and slightly soft, the way
     anything that far back reads through this much water */
  .p-chest  { left:52%; width:clamp(78px, 8.8vw, 156px); bottom:17vh; z-index:5;
              opacity:.8; filter:blur(.4px) saturate(.78) brightness(.92) }
  .p-coral  { left:61%;  width:clamp(90px, 11vw, 180px); bottom:2vh; z-index:6 }
  /* the starfish lies in the near sand at the wreck's foot: foreshortened, tilted, and with a
     contact shadow, so it reads as settled on the bottom rather than hung in the water */
  .p-star   { left:46%; bottom:20vh; width:clamp(30px, 3.4vw, 58px); z-index:8; opacity:.92;
              transform:rotate(-16deg) scaleY(.66);
              filter:drop-shadow(0 2px 2px rgba(0,0,0,.5)) }
  .p-kelp-a { left:25%;  width:clamp(80px, 10vw, 165px); z-index:5 }
  .p-kelp-b { right:32%; width:clamp(95px, 12vw, 195px); z-index:5 }
  .p-kelp-c { left:-1%;  width:clamp(130px, 17vw, 280px); z-index:180 }
  .p-kelp-d { right:-2%; width:clamp(150px, 19vw, 320px); z-index:180 }
  .p-rocks  { left:45%;  width:clamp(110px, 14vw, 230px); bottom:0; z-index:5 }

  .blade{ transform-origin:50% 100%; animation:bend 7s ease-in-out infinite alternate }
  .blade:nth-child(2){ animation-duration:9s; animation-delay:-2s }
  .blade:nth-child(3){ animation-duration:6.2s; animation-delay:-4s }
  .blade:nth-child(4){ animation-duration:10s; animation-delay:-1s }
  @keyframes bend{ from{ transform:rotate(-4deg) skewX(2deg) } to{ transform:rotate(5deg) skewX(-2deg) } }
  .flag{ transform-origin:0% 50%; animation:luff 3.6s ease-in-out infinite alternate }
  @keyframes luff{ from{ transform:rotate(-2.5deg) scaleY(.97) } to{ transform:rotate(2.5deg) scaleY(1.03) } }
  .glint{ animation:glint 5s ease-in-out infinite }
  @keyframes glint{ 0%,72%,100%{ opacity:.25 } 84%{ opacity:1 } }

  /* ---------- the school ---------- */
  .water{ position:absolute; left:0; right:0; top:0; height:78%; z-index:10 }
  .swimmer{ position:absolute; top:0; left:0; width:var(--fish); height:var(--fish);
            transform:translateX(-9999px); will-change:transform, opacity, filter }
  .fish{ position:absolute; inset:0; animation:surge 1.84s ease-in-out infinite }
  .fish i{ position:absolute; inset:0; display:block; background-size:contain;
           background-repeat:no-repeat; background-position:center }
  .fish .tail{ background-image:var(--t); transform-origin:38.3% 50.1%;
               animation:tailbeat var(--beat) cubic-bezier(.42,0,.58,1) var(--phase) infinite alternate }
  .fish .body{ background-image:var(--b); transform-origin:66.4% 49.8%;
               animation:yaw var(--beat) cubic-bezier(.42,0,.58,1) var(--phase) infinite alternate }
  .s-orange{ --t:var(--t-orange); --b:var(--b-orange); --fish:clamp(150px, min(30vmin, 34vh), 380px); --beat:.92s; --phase:-.10s }
  .s-blue  { --t:var(--t-blue);   --b:var(--b-blue);   --fish:clamp(132px, min(26vmin, 30vh), 330px); --beat:.81s; --phase:-.37s }
  .s-pink  { --t:var(--t-pink);   --b:var(--b-pink);   --fish:clamp(118px, min(23vmin, 26vh), 290px); --beat:.70s; --phase:-.45s }

           box-shadow:inset 0 0 0 1px rgba(210,238,255,.45) }

  /* ---------- the nameplate ---------- */
  /* the name is sandblasted into the tank glass, not printed over the picture:
     translucent, wide-tracked, lit from above and shadowed below */
  .scrim{ position:absolute; left:0; right:0; bottom:0; height:30vh; z-index:190; pointer-events:none;
          background:linear-gradient(180deg, rgba(4,9,14,0), rgba(4,9,14,.34) 62%, rgba(4,9,14,.60)) }
  .plate{ position:absolute; left:50%; transform:translateX(-50%); bottom:clamp(14px, 3.4vh, 46px);
          z-index:200; text-align:center; pointer-events:none;
          animation:shimmer 11s ease-in-out infinite }
  .name{ margin:0; font-weight:600; line-height:1; text-transform:uppercase;
         font-size:clamp(15px, 3.4vmin, 40px); letter-spacing:.22em; text-wrap:balance;
         color:rgba(214,236,252,.32);
         text-shadow:0 1px 0 rgba(255,255,255,.14), 0 -1px 1px rgba(0,0,0,.45),
                     0 0 30px rgba(120,190,240,.10) }

  .name .b{ color:rgba(236,163,112,.42) }
  .etch{ margin:clamp(7px,1.2vh,15px) auto 0; width:min(46vw, 380px); height:1px;
         background:linear-gradient(90deg, transparent, rgba(190,222,245,.24), transparent) }
  @keyframes shimmer{ 0%,100%{ opacity:.88 } 50%{ opacity:1 } }

  /* ---------- glass ---------- */
  .glass{ position:absolute; inset:0; z-index:300; pointer-events:none;
          box-shadow:inset 0 0 clamp(60px,12vw,220px) rgba(3,7,12,.72),
                     inset 0 0 0 1px rgba(120,180,220,.10) }
  .glass::before{ content:""; position:absolute; top:0; bottom:0; left:0; width:clamp(10px,2.2vw,34px);
                  background:linear-gradient(90deg, rgba(150,212,255,.14), transparent) }
  .glass::after{ content:""; position:absolute; top:0; bottom:0; right:0; width:clamp(10px,2.2vw,34px);
                 background:linear-gradient(270deg, rgba(150,212,255,.14), transparent) }

  .back{ position:absolute; bottom:10px; left:14px; z-index:310; font-family:var(--mono);

  @media (prefers-reduced-motion:reduce){
    .fish,.fish .tail,.fish .body,.surface,.shaft,.caustics,.blade,.flag,.glint,.plate{ animation:none }
  }
</style>

<script>
// ---------------------------------------------------------------------------
// The school. Each fish swims its own crossings of the whole tank: it leaves
// the glass completely before turning, so the turn is never on screen, and
// depth, arc, pace and pause are drawn fresh every trip.
//
// Depth is one number per crossing. It sets size, brightness, focus, apparent
// speed and what the fish passes in front of, so near and far read as near and
// far rather than just big and small.
//
// Nothing steers mid-swim. A crossing reserves the band of water it will sweep
// through; a fish about to set off redraws its route until it finds water no
// other fish has claimed. They simply never pick the same lane.
// ---------------------------------------------------------------------------
(() => {
  const water = document.querySelector(".water");
  if (!water) return;
  const still = matchMedia("(prefers-reduced-motion: reduce)");
  const L = 0.283, R = 0.717, TOP = 0.326, BOT = 0.666;   // where the fish sits inside its canvas
  const rnd = (a, b) => a + Math.random() * (b - a);
  const place = (x, y, dir, k) =>
    `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) scale(${(dir * k).toFixed(3)}, ${k.toFixed(3)})`;

  const claimed = new Map();
  const GUTTER = 14;
  const clash = (me, band) => {
    for (const [who, b] of claimed) {
      if (who === me) continue;
      if (band.top < b.bottom + GUTTER && b.top < band.bottom + GUTTER) return b;
    }
    return null;
  };

  document.querySelectorAll(".swimmer").forEach((swimmer, i) => {
    let goingRight = Math.random() < 0.5;

    if (still.matches) {
      const F = swimmer.offsetWidth;
      swimmer.style.transform =
        place((water.clientWidth - F) * (0.06 + 0.22 * i), (water.clientHeight - F) / 2, 1, 1);
      return;
    }

    const cross = () => {
      const W = water.clientWidth, H = water.clientHeight, F = swimmer.offsetWidth;

      // Four waypoints across the tank, each drawn fresh, so no two crossings trace
      // the same line: a fish may rise the whole way, sink, or wander through the middle.
      const route = (dep) => {
        const k = 0.74 + 0.38 * dep;
        const span = F * k, inset = (F - span) / 2;
        const a = -TOP * span - inset, b = H - BOT * span - inset;
        const lo = Math.min(a, b), hi = Math.max(a, b);
        let r = null;
        for (let tries = 0; tries < 40; tries++) {
          const drift = rnd(0.16, 0.5);                     // how much of the tank it climbs or drops
          const y0 = rnd(lo, hi);
          const ys = [y0];
          for (let s = 1; s < 5; s++) {
            const step = (hi - lo) * drift * rnd(-0.45, 0.45);
            ys.push(Math.max(lo, Math.min(hi, ys[s - 1] + step)));
          }
          const band = { top: Math.min(...ys) + inset + TOP * span,
                         bottom: Math.max(...ys) + inset + BOT * span, dep, who: swimmer };
          const hit = clash(swimmer, band);
          r = { dep, k, span, inset, ys, band };
          if (!hit) return r;
        }
        return r;
      };

      // take the depth furthest from every fish currently in the water, so the
      // school spreads itself into layers without being told to
      const taken = [...claimed.values()].filter(b => b.who !== swimmer).map(b => b.dep);
      const far = (c) => taken.length ? Math.min(...taken.map(d => Math.abs(c - d))) : 1;
      let best = 0.5, bestGap = -1;
      for (const c of [0.06, 0.28, 0.5, 0.72, 0.94]) {
        const g = far(c);
        if (g > bestGap) { bestGap = g; best = c; }
      }
      const r = route(Math.max(0, Math.min(1, best + rnd(-0.05, 0.05))));
      const { dep, k, span, inset, ys, band } = r;

      swimmer.style.opacity = (0.62 + 0.38 * dep).toFixed(2);
      swimmer.style.filter = dep > 0.62 ? "none" : `blur(${((0.62 - dep) * 1.8).toFixed(2)}px)`;
      swimmer.style.zIndex = Math.round(dep * 100);

      const offLeft = -(R * span) - 10, offRight = W - L * span + 10;
      const dir = goingRight ? 1 : -1;
      const to = goingRight ? offRight : offLeft;
      const from = goingRight ? offLeft : offRight;
      claimed.set(swimmer, band);

      // Pace: near fish cross faster than far ones, every trip is a little different, and
      // now and then one dawdles or darts. The crossing itself runs linear — an eased one
      // reads as a fish that keeps stalling at the glass.
      const mood = Math.random() < 0.18 ? rnd(0.62, 0.78) : Math.random() < 0.14 ? rnd(1.35, 1.75) : 1;
      const speed = rnd(0.072, 0.125) * (0.72 + 0.55 * dep) * mood;   // px per ms
      const duration = Math.abs(to - from) / speed;

      // tail beat follows the pace — a darting fish beats faster than a drifting one
      const beat = Math.max(0.38, Math.min(1.0, 0.48 / (speed * 6))).toFixed(2) + "s";
      swimmer.querySelectorAll(".tail, .body").forEach(el => { el.style.animationDuration = beat; });

      const frames = ys.map((y, s) => ({
        transform: place(from + (to - from) * (s / (ys.length - 1)), y, dir, k),
        offset: s / (ys.length - 1)
      }));
      const anim = swimmer.animate(frames, { duration, easing: "linear", fill: "forwards" });

      anim.onfinish = () => {
        claimed.delete(swimmer);
        goingRight = !goingRight;
        setTimeout(cross, rnd(250, 1800));
      };
    };

    setTimeout(cross, i * rnd(260, 1100));
  });

  // -------------------------------------------------------------------------
  // Bubbles. Two steady seeps — the chest and the wreck's portholes — plus the
  // odd one from anywhere along the bed.
  // -------------------------------------------------------------------------
  const field = document.querySelector(".bubbles");
  if (field && !still.matches) {
    const seeps = [
      () => ({ x: innerWidth * rnd(0.10, 0.26), r: rnd(3, 8) }),     // the wreck
      () => ({ x: innerWidth * rnd(0.53, 0.57), r: rnd(2, 4) }),     // the far chest, small with distance
      () => ({ x: innerWidth * rnd(0.02, 0.98), r: rnd(2, 5) })      // anywhere along the bed
    ];
    const blow = () => {
      const pick = seeps[Math.random() < 0.46 ? 0 : Math.random() < 0.7 ? 1 : 2]();
      const b = document.createElement("div");
      b.className = "bubble";
      b.style.width = b.style.height = pick.r * 2 + "px";
      b.style.left = pick.x + "px";
      b.style.bottom = "0px";
      field.appendChild(b);
      const drift = rnd(-70, 70), rise = innerHeight * rnd(0.72, 1.05);
      const a = b.animate([
        { transform: "translate(0,0) scale(.6)", opacity: 0 },
        { transform: `translate(${drift * 0.4}px, ${-rise * 0.35}px) scale(1)`, opacity: .75, offset: .35 },
        { transform: `translate(${drift}px, ${-rise}px) scale(1.08)`, opacity: 0 }
      ], { duration: rnd(5200, 11000), easing: "cubic-bezier(.36,.1,.6,.9)" });
      a.onfinish = () => b.remove();
      setTimeout(blow, rnd(140, 720));
    };
    blow();
  }

  // -------------------------------------------------------------------------
  // Screensaver manners: the cursor and the hint fade out when nothing moves,
  // and a click takes the tank full screen.
  // -------------------------------------------------------------------------
  let idle;
  const wake = () => {
    document.body.classList.remove("resting");
    clearTimeout(idle);
    idle = setTimeout(() => document.body.classList.add("resting"), 2600);
  };
  ["mousemove", "keydown", "touchstart"].forEach(e => addEventListener(e, wake, { passive: true }));
  wake();

  addEventListener("click", e => {
    // the way-back link is a click too; let it navigate instead of swallowing it
    if (e.target.closest("a")) return;
    if (document.fullscreenElement) document.exitFullscreen?.();
    else document.documentElement.requestFullscreen?.().catch(() => {});
  });
})();
</script>
</body>
</html>
